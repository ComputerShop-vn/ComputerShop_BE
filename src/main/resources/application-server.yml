spring:
  application:
    name: SBA301_ComputerShop

  # ===============================
  # DATABASE (MYSQL)
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
    username: test
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ===============================
  # EMAIL CONFIG
  # ===============================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS}
    password: ${PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
# ===============================
# SERVER
# ===============================
server:
  port: 8080
  servlet:
    context-path: /api


# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
      springframework:
        web: INFO
# ===============================
# JWT CONFIG (MAP FROM .env)
# ===============================
jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION}

  # ===============================
  # Cloudinary CONFIG (MAP FROM .env)
  # ===============================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

  # ===============================
  # VNPAY CONFIG
  # ===============================
vnpay:
  tmn-code: ${VNP_TMN_CODE}
  hash-secret: ${VNP_HASH_SECRET}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  return-url: http://localhost:8080/api/orders/payment/callback
  ipn-url: https://seamus-monoecious-retractively.ngrok-free.dev/api/orders/payment/vnp-ipn
  version: "2.1.0"
  command: "pay"
  curr-code: "VND"
  order-type: "other"
  locale: "vn"

